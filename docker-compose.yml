services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: barber
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Define LOCAL_DB_PASSWORD para desarrollo}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - barber-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d barber"]
      interval: 5s
      retries: 10
volumes:
  barber-data:
